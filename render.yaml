services:
  - type: web
    name: real-time-chat-springboot  
    env: java
    plan: free

    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/app.jar

    envVars:
      - key: JAVA_HOME
        value: /usr/lib/jvm/java-17-openjdk
      - key: PORT
        value: 8080   
